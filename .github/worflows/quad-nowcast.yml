name: Quad nowcast (fresh regime estimate)

# Re-estimates the CURRENT growth/inflation Quad every day from the daily market
# series (oil, HY spreads, 2s10s, VIX, USTs, USD) and writes it to
# data/macro/quad.json `current`, preserving `history` (the monthly GDP/CPI path
# that drives the history chart). Runs after the daily macro fetch; also on demand.

on:
  schedule:
    - cron: '30 22 * * 1-5'      # ~after the US close, weekdays (UTC)
  workflow_dispatch:

concurrency:
  group: quad-nowcast
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Nowcast the quad
        run: python3 pipeline/quad_nowcast.py
      - name: Commit
        run: |
          git config user.name  "quad-nowcast[bot]"
          git config user.email "quad-nowcast@users.noreply.github.com"
          git add data/macro/quad.json || true
          if ! git diff --cached --quiet; then
            git commit -m "quad nowcast: $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              git pull --rebase -X ours origin ${{ github.ref_name }} || true
              git push && break || sleep 5
            done
          else
            echo "no change"
          fi

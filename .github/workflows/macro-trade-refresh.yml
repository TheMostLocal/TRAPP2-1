name: Macro Trade + World Bank Refresh

# US trade balance (FRED) prints monthly with a ~45-day lag; World Bank GDP is
# annual but cheap to re-pull. Running on the 3rd of each month catches the
# monthly trade print and keeps the World Bank file current.
#
# ---------------------------------------------------------------------------
# CONFLICT-PROOF PUSH — same fix as midday.yml. data/macro_trade.json and
# data/worldbank_countries.json are machine-generated (whole file rewritten each
# run). A plain push that's behind origin gets rejected, and `git pull --rebase`
# on two full-file rewrites of the SAME file ALWAYS conflicts -> "unmerged
# files" -> the retry loop is stuck. Fix: don't merge histories; let the latest
# run win via `git merge -X ours`, which never leaves unmerged files. Also share
# a concurrency group with the other data-writing workflows so they can't race.
# ---------------------------------------------------------------------------

on:
  schedule:
    # z147: every weekday at 0935 ET (after the 0830 ET trade releases; commits only when data changed).
    # Was monthly (the 3rd). Same push group as Mid-Day, which runs at 0807 / 1132 ET - never together.
    - cron: '35 13 * * 1-5'    # 0935 EDT
    - cron: '35 14 * * 1-5'    # 0935 EST
  workflow_dispatch: {}

# Serialize against midday + nightly so two data-writing jobs never push at once.
concurrency:
  group: trapp2-1-data-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    # z147: GitHub cron runs on UTC. Each Eastern time is listed for EDT (UTC-4) and EST (UTC-5);
    # this job keeps only the run that lands on the intended ET time (the other one skips in seconds).
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: Eastern-time gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          S="${{ github.event.schedule }}"
          OFF=$(TZ=America/New_York date +%z); OFFH=$((10#${OFF:1:2}))
          UM=$(echo "$S" | awk '{print $1}'); UH=$(echo "$S" | awk '{print $2}')
          ETH=$(( (10#$UH - OFFH + 24) % 24 )); ETM=$(printf '%02d' "$UM")
          case " 9:35 " in *" ${ETH}:${ETM} "*) RUN=true ;; *) RUN=false ;; esac
          echo "schedule '$S' = ${ETH}:${ETM} ET today (UTC${OFF}) -> run=${RUN}"
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install requirements
        run: pip install requests pandas fredapi

      - name: Fetch FRED US trade balance (writes data/macro_trade.json)
        env:
          FED_API_KEY: ${{ secrets.FED_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        # Was `fetch_macro.py` (the FRED macro series, which Mid-Day owns), so
        # macro_trade.json had been frozen since 2026-06-18.
        run: python pipeline/fetch_macro_trade.py
        continue-on-error: true

      - name: Fetch fresh global-trade GDP (IMF WEO + World Bank, keyless)
        # Writes data/global_trade.json for the Global Trade tab; was never wired
        # into a workflow (frozen since 2026-06-21).
        run: python pipeline/fetch_global_trade.py
        continue-on-error: true

      - name: Fetch World Bank country data
        run: python pipeline/fetch_worldbank.py
        continue-on-error: true

      - name: Commit & push (trade scope only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # SCOPED to this job's outputs. The old step staged ALL of data/ and, if
          # a merge failed, copied this run's whole data/ tree over origin -
          # reverting every other workflow's files (tape, fx, leadership, ...).
          OWN="data/macro_trade.json data/global_trade.json data/worldbank_countries.json"
          for p in $OWN; do git add -A "$p" 2>/dev/null || true; done
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          echo "=== files staged ==="; git diff --staged --name-only
          git commit -m "Macro trade + global trade + World Bank refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git stash push --include-untracked -q -m leftovers 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "Pushed on attempt $i"; exit 0; fi
            echo "Push rejected - merging remote (ours wins for OUR files) and retrying"
            git fetch origin main
            git merge -X ours origin/main --no-edit 2>/dev/null || true
            if [ -f .git/MERGE_HEAD ]; then
              for p in $OWN; do git checkout --ours -- "$p" 2>/dev/null || true; git add -A "$p" 2>/dev/null || true; done
              git commit --no-edit 2>/dev/null || true
            fi
            sleep $((i * 3))
          done
          echo "ERROR: could not push after 5 attempts."; exit 1

name: Fed Monitor (QE/QT + FOMC + NY Fed)

# Writes data/fed/monitor.json for the app's Fed tab (z92):
#   H.4.1 balance sheet (FRED: WALCL, WSHOTSL, WSHOMCB, WRESBAL, WTREGEN, RRPONTSYD)
#   FOMC statements / minutes / projections + Fed speeches (federalreserve.gov RSS)
#   SEP medians (FRED) · NY Fed SOMA summary + latest operations (markets.newyorkfed.org)
# Times are UTC and chosen around the releases:
#   13:00 Mon-Fri   morning sweep (overnight speeches, NY Fed operation results)
#   18:45 Mon-Fri   after a 2:00pm ET FOMC statement (EDT; 19:45 covers EST)
#   21:00 Thu       after the H.4.1 release (4:30pm ET)
on:
  schedule:
    # z147: kept to Eastern time all year - 0900 ET weekdays, 1445 ET (after a 1400 FOMC statement) and
    # 1700 ET Thursdays (after the 1630 ET H.4.1 balance-sheet release; in winter the old 21:00 UTC run
    # landed at 1600, before the release).
    - cron: '0 13 * * 1-5'     # 0900 EDT
    - cron: '0 14 * * 1-5'     # 0900 EST
    - cron: '45 18 * * 1-5'    # 1445 EDT
    - cron: '45 19 * * 1-5'    # 1445 EST
    - cron: '0 21 * * 4'       # 1700 EDT Thu
    - cron: '0 22 * * 4'       # 1700 EST Thu
  workflow_dispatch:

concurrency:
  group: trapp2-1-fed-monitor
  cancel-in-progress: false

jobs:
  gate:
    # z147: GitHub cron runs on UTC. Each Eastern time is listed for EDT (UTC-4) and EST (UTC-5);
    # this job keeps only the run that lands on the intended ET time (the other one skips in seconds).
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: Eastern-time gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          S="${{ github.event.schedule }}"
          OFF=$(TZ=America/New_York date +%z); OFFH=$((10#${OFF:1:2}))
          UM=$(echo "$S" | awk '{print $1}'); UH=$(echo "$S" | awk '{print $2}')
          ETH=$(( (10#$UH - OFFH + 24) % 24 )); ETM=$(printf '%02d' "$UM")
          case " 9:00 14:45 17:00 " in *" ${ETH}:${ETM} "*) RUN=true ;; *) RUN=false ;; esac
          echo "schedule '$S' = ${ETH}:${ETM} ET today (UTC${OFF}) -> run=${RUN}"
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"

  monitor:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build data/fed/monitor.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FED_API_KEY: ${{ secrets.FED_API_KEY }}
        run: python pipeline/fetch_fed_monitor.py
      - name: Commit & push (scoped to data/fed/, retry, never force)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/fed/
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Fed monitor $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git fetch origin && git merge -X ours origin/main -m "merge remote" || true
            sleep $((i * 5))
          done
          echo "::error::push failed after 5 attempts"; exit 1

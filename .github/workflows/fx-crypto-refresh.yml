# ============================================================
#  >>> DESTINATION: TheMostLocal/TRAPP2-1
#  >>> FILE PATH:   .github/workflows/fx-crypto-refresh.yml
#
#  z147 - FX + crypto trade around the clock. An hourly trigger (at :11, off GitHub's busy quarter
#  hours) starts a job that refreshes every 15 minutes for up to ~170 minutes (pipeline/fx_crypto_loop.sh);
#  a trigger that arrives while it runs QUEUES behind it (cancel-in-progress: false) instead of killing it,
#  so there is always one running and one waiting. Was "*/15 * * * *" with cancel-in-progress: true -
#  dropped and cancelled runs left the rates hours old.
# ============================================================
name: FX + Crypto Refresh (24h markets)

on:
  schedule:
    - cron: '11 * * * *'     # hourly, every day (crypto never closes; FX Sunday 1700 → Friday 1700 ET)
  workflow_dispatch: {}

concurrency:
  group: fx-crypto-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install yfinance
      - name: FX + crypto every 15 minutes (:02 / :17 / :32 / :47)
        env:
          LOOP_BUDGET_MIN: '170'
        run: bash pipeline/fx_crypto_loop.sh

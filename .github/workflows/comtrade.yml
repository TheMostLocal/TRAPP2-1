# ============================================================
#  >>> DESTINATION: TheMostLocal/TRAPP2-1
#  >>> FILE PATH:   .github/workflows/comtrade.yml
#
#  Fetches UN Comtrade product-level bilateral trade flows MONTHLY and writes
#  data/comtrade_flows.json. Annual trade data only refreshes a few times a
#  year, so monthly is plenty and keeps the free 500-calls/day quota untouched
#  (~24 calls per run, one per relationship).
#
#  Requires one repo secret:
#    COMTRADE_API_KEY   (free at https://comtradeplus.un.org → Sign up for API key)
# ============================================================

name: UN Comtrade Bilateral Flows

on:
  schedule:
    # z147: weekly, Sundays 0620 ET. Comtrade publishes monthly with a ~2-month lag and the free key has a
    # daily call quota, so weekly picks up every new release within days without burning the quota.
    # Was monthly (the 3rd).
    - cron: '20 10 * * 0'      # 0620 EDT
    - cron: '20 11 * * 0'      # 0620 EST
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: comtrade
  cancel-in-progress: false

jobs:
  gate:
    # z147: GitHub cron runs on UTC. Each Eastern time is listed for EDT (UTC-4) and EST (UTC-5);
    # this job keeps only the run that lands on the intended ET time (the other one skips in seconds).
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: Eastern-time gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          S="${{ github.event.schedule }}"
          OFF=$(TZ=America/New_York date +%z); OFFH=$((10#${OFF:1:2}))
          UM=$(echo "$S" | awk '{print $1}'); UH=$(echo "$S" | awk '{print $2}')
          ETH=$(( (10#$UH - OFFH + 24) % 24 )); ETM=$(printf '%02d' "$UM")
          case " 6:20 " in *" ${ETH}:${ETM} "*) RUN=true ;; *) RUN=false ;; esac
          echo "schedule '$S' = ${ETH}:${ETM} ET today (UTC${OFF}) -> run=${RUN}"
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"

  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Comtrade flows
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: python pipeline/fetch_comtrade.py

      - name: Commit & push (comtrade scope only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/comtrade_flows.json
          if git diff --staged --quiet; then
            echo "No comtrade changes to commit"
            exit 0
          fi
          git commit -m "Comtrade bilateral flows $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $i"; break; fi
            git fetch origin
            git merge -X ours origin/${{ github.ref_name }} 2>/dev/null || true
            if [ -f .git/MERGE_HEAD ]; then
              git checkout --ours -- data/comtrade_flows.json 2>/dev/null || true
              git add -A data/comtrade_flows.json 2>/dev/null || true
              git commit --no-edit 2>/dev/null || true
            fi
            sleep 4
          done

# ============================================================
#  >>> DESTINATION: TheMostLocal/TRAPP2-1
#  >>> FILE PATH:   .github/workflows/macro-quad.yml
#
#  Computes the REAL growth/inflation quad from FRED (Real GDP YoY + CPI YoY,
#  rate-of-change) and writes data/macro/quad.json, which the bot runner reads
#  for true macro parity (instead of its market-implied proxy). GDP is quarterly
#  and CPI monthly, so MONTHLY cadence keeps the quad current.
#
#  Requires the FRED key you already use:  secret FED_API_KEY
# ============================================================

name: Macro Quad (FRED)

on:
  schedule:
    # z147: every weekday at 0915 ET - after the 0830 ET releases (CPI monthly, GDP quarterly), so the
    # quad the bot reads (data/macro/quad.json) turns the same morning a print lands. Was monthly (the 5th).
    - cron: '15 13 * * 1-5'    # 0915 EDT
    - cron: '15 14 * * 1-5'    # 0915 EST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: macro-quad
  cancel-in-progress: false

jobs:
  gate:
    # z147: GitHub cron runs on UTC. Each Eastern time is listed for EDT (UTC-4) and EST (UTC-5);
    # this job keeps only the run that lands on the intended ET time (the other one skips in seconds).
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: Eastern-time gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          S="${{ github.event.schedule }}"
          OFF=$(TZ=America/New_York date +%z); OFFH=$((10#${OFF:1:2}))
          UM=$(echo "$S" | awk '{print $1}'); UH=$(echo "$S" | awk '{print $2}')
          ETH=$(( (10#$UH - OFFH + 24) % 24 )); ETM=$(printf '%02d' "$UM")
          case " 9:15 " in *" ${ETH}:${ETM} "*) RUN=true ;; *) RUN=false ;; esac
          echo "schedule '$S' = ${ETH}:${ETM} ET today (UTC${OFF}) -> run=${RUN}"
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"

  quad:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute macro quad
        env:
          FED_API_KEY: ${{ secrets.FED_API_KEY }}
        run: python pipeline/fetch_macro_quad.py

      - name: Commit & push (macro scope only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/macro/quad.json
          git add -A data/macro/quad_history_full.json 2>/dev/null || true   # z116: separate - one missing path stages nothing
          if git diff --staged --quiet; then
            echo "No quad change to commit"
            exit 0
          fi
          git commit -m "Macro quad $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $i"; break; fi
            git fetch origin
            git merge -X ours origin/${{ github.ref_name }} 2>/dev/null || true
            if [ -f .git/MERGE_HEAD ]; then
              git checkout --ours -- data/macro/quad.json 2>/dev/null || true
              git add -A data/macro/quad.json 2>/dev/null || true; git add -A data/macro/quad_history_full.json 2>/dev/null || true
              git commit --no-edit 2>/dev/null || true
            fi
            sleep 4
          done
